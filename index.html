<!doctype html>
<html lang="ta" class="lang-ta">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>கிரக நிலைகள் · Planet Positions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f0f4ff;
        --card: #ffffff;
        --border: rgba(26, 26, 46, 0.12);
        --text: #2d3250;
        --muted: #6b7190;
        --accent: #a78bfa;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Noto Sans Tamil", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      .wrap { max-width: 1100px; margin: 0 auto; padding: 1rem 1rem 2rem; }
      .header { margin-bottom: 1.5rem; }
      .header-brand {
        text-align: center;
        margin-bottom: 1.25rem;
        padding: 0 0.25rem;
      }
      .eyebrow { color: var(--accent); text-transform: uppercase; letter-spacing: 0.15em; font-size: 0.8rem; }
      h1 {
        font-size: clamp(1.5rem, 5vw, 2.2rem);
        line-height: 1.2;
        margin: 0;
      }
      .bilingual {
        display: inline-flex;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: center;
        gap: 0.35em;
      }
      .bilingual-en::before {
        content: "·";
        margin-right: 0.35em;
        color: var(--muted);
        font-weight: 400;
      }
      .bilingual-en {
        font-size: 0.85em;
        font-weight: 400;
        color: var(--muted);
        font-family: system-ui, sans-serif;
        text-transform: none;
        letter-spacing: normal;
      }
      h1 .bilingual-en { font-size: 0.55em; }
      .sub {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35rem;
        color: var(--muted);
        font-size: clamp(0.8rem, 3.2vw, 0.95rem);
        line-height: 1.5;
        margin: 0.6rem auto 0;
        max-width: 36rem;
        text-align: center;
      }
      .sub .bilingual-en { font-size: 0.95em; }
      .sub-meta { font-size: 0.92em; }
      .date-form {
        width: 100%;
        max-width: 28rem;
        margin: 0 auto;
      }
      .form-card {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 1rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1rem;
        box-shadow: 0 1px 3px rgba(26, 26, 46, 0.05);
      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        width: 100%;
      }
      .form-group--datetime {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
      }
      .form-field {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        min-width: 0;
      }
      .form-row {
        display: contents;
      }
      .form-row--location {
        display: contents;
      }
      .date-form label,
      .location-label {
        font-size: 0.8rem;
        color: var(--muted);
        line-height: 1.2;
      }
      .location-label .bilingual-en { font-size: 0.62rem; }
      .date-form input[type="date"],
      .date-form input[type="time"],
      .date-form input[type="text"] {
        font-family: inherit;
        font-size: 0.9rem;
        padding: 0.6rem 0.75rem;
        border-radius: 0.65rem;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        width: 100%;
        min-width: 0;
        color-scheme: light;
      }
      .date-form input[type="date"]:focus,
      .date-form input[type="time"]:focus,
      .date-form input[type="text"]:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(167, 139, 250, 0.2);
      }
      .submit-btn {
        width: 100%;
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 600;
        padding: 0.75rem 1.25rem;
        border-radius: 0.75rem;
        border: none;
        background: var(--accent);
        color: #2d3250;
        cursor: pointer;
        transition: opacity 0.15s ease;
        margin-top: 0.15rem;
      }
      .submit-btn:hover { opacity: 0.9; }
      .submit-btn:active { opacity: 0.8; }
      .sunrise-display {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: center;
        gap: 0.45rem;
        width: 100%;
        font-size: 0.88rem;
        color: var(--muted);
        padding: 0.15rem 0;
      }
      .sunrise-value {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: var(--text);
      }
      .place-row {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        width: 100%;
      }
      .place-row input[type="text"] { flex: 1; }
      .place-search-btn {
        flex-shrink: 0;
        font-family: inherit;
        font-size: 0.9rem;
        padding: 0.6rem 0.7rem;
        border-radius: 0.65rem;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        cursor: pointer;
        line-height: 1;
        transition: border-color 0.15s ease, opacity 0.15s ease;
      }
      .place-search-btn:hover { border-color: var(--accent); opacity: 0.9; }
      .place-location-btn {
        flex-shrink: 0;
        font-family: inherit;
        font-size: 0.9rem;
        padding: 0.6rem 0.7rem;
        border-radius: 0.65rem;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        cursor: pointer;
        line-height: 1;
        transition: border-color 0.15s ease, opacity 0.15s ease;
      }
      .place-location-btn:hover:not(:disabled) { border-color: var(--accent); opacity: 0.9; }
      .place-location-btn:disabled { opacity: 0.55; cursor: wait; }
      .coords-display {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 0.5rem;
        font-size: 0.78rem;
        color: var(--muted);
        line-height: 1.2;
      }
      .coords-display .bilingual { justify-content: flex-start; }
      .coords-display .bilingual-en { font-size: 0.6rem; }
      .coords-fields {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        width: 100%;
      }
      .coords-input {
        flex: 1;
        min-width: 0;
        width: 12ch;
        max-width: 12ch;
        font-family: system-ui, sans-serif;
        font-size: 0.82rem;
        color: var(--text);
        font-variant-numeric: tabular-nums;
        padding: 0.55rem 0.6rem;
        border-radius: 0.65rem;
        border: 1px solid var(--border);
        background: var(--card);
      }
      .coords-input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(167, 139, 250, 0.2);
      }
      .coords-input.is-loading { opacity: 0.55; }
      .coords-sep { color: var(--muted); font-size: 0.82rem; flex-shrink: 0; }
      @media (min-width: 640px) {
        .wrap { padding: 1.5rem 1.5rem 2.5rem; }
        .date-form { max-width: 32rem; }
        .form-card { padding: 1.15rem 1.25rem; }
      }
      .layout { display: grid; grid-template-columns: 1fr 300px; gap: 1.5rem; }
      .panel, .table { background: var(--card); border: 1px solid var(--border); border-radius: 1.25rem; padding: 1.25rem; box-shadow: 0 1px 3px rgba(26, 26, 46, 0.06); }
      .panel { background: linear-gradient(145deg, #faf8ff 0%, #ffffff 55%, #fff8f0 100%); }
      svg { width: 100%; max-width: 560px; display: block; margin: 0 auto; }
      table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
      th, td { padding: 0.6rem 0.35rem; text-align: left; border-bottom: 1px solid var(--border); }
      th { color: var(--muted); font-size: 0.7rem; vertical-align: bottom; }
      th .bilingual { font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
      td:first-child { font-family: "Noto Sans Tamil", sans-serif; font-weight: 600; display: flex; align-items: center; gap: 0.35rem; }
      .table-symbol { display: inline-block; width: 1.25em; font-size: 1.05em; line-height: 1; text-align: center; font-family: serif; flex-shrink: 0; }
      .table-name { display: inline-flex; flex-direction: column; line-height: 1.25; }
      .table-name-en { font-size: 0.68rem; font-weight: 400; color: var(--muted); font-family: "DM Sans", sans-serif; }
      .table-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 0.2rem;
      }
      .table-header h2 { margin: 0; font-size: 1.2rem; }
      .table-toolbar { display: flex; gap: 0.5rem; flex-shrink: 0; }
      .table-edit-btn,
      .table-done-btn {
        font-family: inherit;
        font-size: 0.75rem;
        font-weight: 600;
        padding: 0.35rem 0.7rem;
        border-radius: 0.5rem;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        cursor: pointer;
      }
      .table-done-btn {
        border-color: var(--accent);
        background: var(--accent);
        color: #2d3250;
      }
      .position-consistency {
        font-size: 0.8rem;
        line-height: 1.45;
        padding: 0.5rem 0.65rem;
        border-radius: 0.5rem;
        margin: 0 0 0.75rem;
      }
      .position-consistency ul {
        margin: 0.35rem 0 0;
        padding-left: 1.1rem;
      }
      .position-consistency li { margin: 0.15rem 0; }
      .position-consistency--ok {
        background: #ecfdf5;
        color: #047857;
        border: 1px solid #a7f3d0;
      }
      .position-consistency--warn {
        background: #fff7ed;
        color: #c2410c;
        border: 1px solid #fed7aa;
      }
      .position-consistency--edit {
        background: #f0f4ff;
        color: #5b21b6;
        border: 1px solid #ddd6fe;
      }
      .consistency-note {
        margin: 0.35rem 0 0;
        font-size: 0.75rem;
        opacity: 0.92;
      }
      .ephemeris-select {
        width: 100%;
        font-family: inherit;
        font-size: 0.85rem;
        padding: 0.55rem 0.65rem;
        border-radius: 0.65rem;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
      }
      .table-input {
        width: 100%;
        min-width: 0;
        font-family: inherit;
        font-size: 0.78rem;
        padding: 0.3rem 0.4rem;
        border-radius: 0.45rem;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        font-variant-numeric: tabular-nums;
      }
      .table-input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(167, 139, 250, 0.2);
      }
      @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
      .lagnam-spoke {
        stroke: #f59e0b;
        stroke-width: 4;
        stroke-linecap: round;
        opacity: 1;
      }
      .lagnam-label {
        fill: #b45309;
        font-family: "Noto Sans Tamil", sans-serif;
        font-size: 8px;
        font-weight: 700;
        paint-order: stroke fill;
        stroke: rgba(255, 255, 255, 0.92);
        stroke-width: 3;
      }
      .lang-tabs {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        margin: 0 0 1.25rem;
      }
      .lang-tab {
        padding: 0.4rem 1.1rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--card);
        color: var(--muted);
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
        font-family: inherit;
      }
      .lang-tab:hover { border-color: var(--accent); color: var(--text); }
      .lang-tab.is-active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      html.lang-ta .bilingual-en,
      html.lang-ta .table-name-en { display: none !important; }
      html.lang-en .bilingual > span:first-child:not(.bilingual-en),
      html.lang-en .table-name > span:first-child { display: none !important; }
      html.lang-en .bilingual-en::before { content: none; margin: 0; }
      html.lang-en .bilingual-en,
      html.lang-en .table-name-en {
        color: inherit;
        font-size: inherit;
        font-weight: inherit;
        font-family: system-ui, sans-serif;
      }
      html.lang-en h1 .bilingual-en { font-size: 1em; font-weight: 700; }
      html.lang-en .sub .bilingual-en { font-size: inherit; }
      html.lang-en th .bilingual-en { font-size: inherit; }
      html.lang-en body { font-family: system-ui, sans-serif; }
      html.lang-en .location-label .bilingual-en { font-size: inherit; }
      html.lang-en .coords-display .bilingual-en { font-size: inherit; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="header">
        <div class="header-brand">
          <h1>
            <span class="bilingual">
              <span>கிரக நிலைகள்</span>
              <span class="bilingual-en">Planet Positions</span>
            </span>
          </h1>
          <p class="sub" id="subtitle">
            <span class="bilingual">
              <span>நாள் 16 பாகங்கள் · காலை 6 மணி முதல்</span>
              <span class="bilingual-en">16 day sections · from 6 AM</span>
            </span>
            <span class="sub-meta" id="subtitleMeta"></span>
          </p>
        </div>
        <nav class="lang-tabs" role="tablist" aria-label="Language">
          <button type="button" class="lang-tab is-active" id="langTabTa" role="tab" aria-selected="true">தமிழ்</button>
          <button type="button" class="lang-tab" id="langTabEn" role="tab" aria-selected="false">English</button>
        </nav>
        <form class="date-form" id="dateForm">
          <div class="form-card">
            <div class="form-group form-group--datetime">
              <div class="form-field">
                <label for="dateInput"><span class="bilingual"><span>தேதி</span><span class="bilingual-en">Select date</span></span></label>
                <input type="date" id="dateInput" required />
              </div>
              <div class="form-field">
                <label for="timeInput"><span class="bilingual"><span>நேரம்</span><span class="bilingual-en">Time</span></span></label>
                <input type="time" id="timeInput" required />
              </div>
            </div>
            <div class="form-group form-group--sunrise">
              <span class="sunrise-display" id="sunriseDisplay" aria-live="polite">
                <span class="bilingual">
                  <span>சூரிய உதயம்</span>
                  <span class="bilingual-en">Sunrise</span>
                </span>
                <span class="sunrise-value" id="sunriseValue"></span>
              </span>
            </div>
            <div class="form-group form-group--place">
              <label for="placeInput" class="location-label">
                <span class="bilingual">
                  <span>இடம்</span>
                  <span class="bilingual-en">Place</span>
                </span>
              </label>
              <div class="place-row">
                <input type="text" id="placeInput" list="placePresets" placeholder="Chennai" autocomplete="off" />
                <button type="button" id="placeLocationBtn" class="place-location-btn" title="Use current location and time" aria-label="Use current location and time">⌖</button>
                <button type="button" id="placeSearchBtn" class="place-search-btn" title="Search place" aria-label="Search place">⌕</button>
              </div>
            </div>
            <div class="form-group form-group--coords">
              <div class="coords-display" id="coordsDisplay">
                <span class="bilingual">
                  <span>ஆயத்தொலைவு</span>
                  <span class="bilingual-en">Coordinates</span>
                </span>
                <span class="coords-fields">
                  <input type="text" class="coords-input" id="latInput" inputmode="decimal" aria-label="Latitude" placeholder="Lat" maxlength="12" />
                  <span class="coords-sep">,</span>
                  <input type="text" class="coords-input" id="lonInput" inputmode="decimal" aria-label="Longitude" placeholder="Lon" maxlength="12" />
                </span>
              </div>
            </div>
            <button type="submit" class="submit-btn"><span class="bilingual"><span>சமர்ப்பி</span><span class="bilingual-en">Submit</span></span></button>
          </div>
        </form>
        <datalist id="placePresets">
          <option value="Chennai, Tamil Nadu, India"></option>
          <option value="Coimbatore, Tamil Nadu, India"></option>
          <option value="Madurai, Tamil Nadu, India"></option>
          <option value="Trichy, Tamil Nadu, India"></option>
          <option value="Salem, Tamil Nadu, India"></option>
          <option value="Bengaluru, Karnataka, India"></option>
          <option value="Mumbai, Maharashtra, India"></option>
          <option value="Delhi, India"></option>
        </datalist>
      </header>
      <div class="layout">
        <section class="panel"><svg id="chart" viewBox="0 0 560 560"></svg></section>
        <aside class="table">
          <div class="table-header">
            <h2>
              <span class="bilingual">
                <span>கிரக நிலைகள்</span>
                <span class="bilingual-en">Planet Positions</span>
              </span>
            </h2>
            <div class="table-toolbar">
              <button type="button" id="refreshPositionsBtn" class="table-edit-btn" title="Reset planet positions and degrees"><span class="bilingual"><span>புதுப்பி</span><span class="bilingual-en">Refresh</span></span></button>
              <button type="button" id="editPositionsBtn" class="table-edit-btn"><span class="bilingual"><span>திருத்து</span><span class="bilingual-en">Edit</span></span></button>
              <button type="button" id="donePositionsBtn" class="table-done-btn" hidden><span class="bilingual"><span>முடிந்தது</span><span class="bilingual-en">Done</span></span></button>
            </div>
          </div>
          <p class="sub" id="tableDate" style="margin: 0.4rem 0 1rem"></p>
          <div id="positionConsistency" class="position-consistency" role="status" aria-live="polite" hidden></div>
          <table><thead><tr>
            <th><span class="bilingual"><span>கிரகம்</span><span class="bilingual-en">Planet</span></span></th>
            <th><span class="bilingual"><span>ராசி</span><span class="bilingual-en">Rasi</span></span></th>
            <th><span class="bilingual"><span>நிலை</span><span class="bilingual-en">Position</span></span></th>
            <th><span class="bilingual"><span>பாகை</span><span class="bilingual-en">Degree</span></span></th>
          </tr></thead><tbody id="rows"></tbody></table>
        </aside>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    <script>
      try {
        const SEGMENTS = 16, DEG = 360 / SEGMENTS, J2000 = Date.UTC(2000, 0, 1, 12);
        const DAY_START_HOUR = 6;
        const MINUTES_PER_SECTOR = (24 * 60) / SEGMENTS;
        const BOUNDARY_LABEL_OFFSET = 31;
        const BOUNDARY_LABEL_STAGGER = 12;
        const formatDegreeLabel = (angle) => {
          const text = angle % 1 === 0 ? String(angle) : angle.toFixed(1);
          return `${text}°`;
        };
        const labelRadialInwardRotation = (angle) => {
          let rotation = angle;
          if (angle >= 90 && angle <= 270) rotation += 180;
          return rotation;
        };
        const formatStartTime = (sectorIndex) => {
          const sectorStart = DAY_START_HOUR * 60 + sectorIndex * MINUTES_PER_SECTOR;
          const m = ((sectorStart % (24 * 60)) + 24 * 60) % (24 * 60);
          const hours = String(Math.floor(m / 60)).padStart(2, "0");
          const minutes = String(m % 60).padStart(2, "0");
          return `${hours}:${minutes}`;
        };
        const formatBoundaryLabel = (angle, sectorIndex) =>
          `${formatDegreeLabel(angle)} (${formatStartTime(sectorIndex)})`;
        const getBoundaryLabelOffset = (sectorIndex) =>
          BOUNDARY_LABEL_OFFSET + (sectorIndex % 2) * BOUNDARY_LABEL_STAGGER;
        const labelRadialRotation = (angle) => {
          let rotation = angle;
          if (Math.cos((angle * Math.PI) / 180) < 0) rotation += 180;
          return rotation;
        };
        const SIGNS = ["Aries","Taurus","Gemini","Cancer","Leo","Virgo","Libra","Scorpio","Sagittarius","Capricorn","Aquarius","Pisces"];
        const RASI_TAMIL = {
          Aries: "மேஷம்",
          Taurus: "ரிஷபம்",
          Gemini: "மிதுனம்",
          Cancer: "கடகம்",
          Leo: "சிம்மம்",
          Virgo: "கன்னி",
          Libra: "துலாம்",
          Scorpio: "விருச்சிகம்",
          Sagittarius: "தனுசு",
          Capricorn: "மகரம்",
          Aquarius: "கும்பம்",
          Pisces: "மீனம்",
        };
        const GRAHAS = [
          { id:"surya", tamil:"சூரியன்", english:"Sun", short:"சூ", letter:"ச", color:"#ff8c00", symbol:"☉", period:365.256, L0:280.46 },
          { id:"chandra", tamil:"சந்திரன்", english:"Moon", short:"ச", letter:"ச", color:"#94a3b8", symbol:"☽", period:27.321661, L0:218.32 },
          { id:"sevvai", tamil:"செவ்வாய்", english:"Mars", short:"செ", letter:"ச", color:"#c1440e", symbol:"♂", period:686.98, L0:355.43 },

          svg += `<circle cx="${c}" cy="${c}" r="${outer}" fill="none" stroke="${chartAccents.ring}" stroke-width="2.5"/>`;
          const z0 = polar(0, outer, c);
          svg += `<line x1="${c}" y1="${c}" x2="${z0.x}" y2="${z0.y}" stroke="${chartAccents.ring}" stroke-width="2" opacity="0.85"/>`;
          for (let i = 0; i < SEGMENTS; i++) {
            const a = i * DEG;
            const o = polar(a, outer, c);
            const sectorFill = i % 2 ? sectorFillColors[i].fill : sectorFillColors[i].fillAlt;
            svg += `<path d="${sector(c, inner, outer, a, a + DEG)}" fill="${sectorFill}"/>`;
            svg += `<line x1="${c}" y1="${c}" x2="${o.x}" y2="${o.y}" stroke="${chartAccents.spoke}" stroke-opacity="0.5" stroke-width="1"/>`;
            const lblOffset = getBoundaryLabelOffset(i);
            const degLbl = polar(a, outer + lblOffset, c);
            const degRot = labelRadialInwardRotation(a);
            svg += `<text x="${degLbl.x}" y="${degLbl.y}" fill="#6d28d9" font-size="8" font-weight="600" letter-spacing="0.02em" text-anchor="middle" dominant-baseline="middle" transform="rotate(${degRot}, ${degLbl.x}, ${degLbl.y})"><tspan x="${degLbl.x}" dy="-0.55em">${formatDegreeLabel(a)}</tspan><tspan x="${degLbl.x}" dy="1.1em">${formatStartTime(i)}</tspan></text>`;
          }
          svg += renderSectorClipDefs(c, inner, outer);
          svg += renderSectorPlanetLabels(positions, c, inner, outer, sectorFillColors);
          const lagnamAngle = getLagnamAngle(date, place);
          const lagnamOuter = polar(lagnamAngle, outer, c);
          const lagnamLbl = polar(lagnamAngle, LAGNAM_LABEL_RADIUS, c);
          const lagnamRot = labelRadialRotation(lagnamAngle);
          const lagnamTextColors = getSectorTextColors(getSectorIndex(lagnamAngle), sectorFillColors);
          svg += `<line x1="${c}" y1="${c}" x2="${lagnamOuter.x}" y2="${lagnamOuter.y}" class="lagnam-spoke"/>`;
          svg += `<g transform="rotate(${lagnamRot}, ${lagnamLbl.x}, ${lagnamLbl.y})">`;
          svg += `<text x="${lagnamLbl.x}" y="${lagnamLbl.y}" class="lagnam-label" text-anchor="middle" dominant-baseline="middle" fill="${lagnamTextColors.fill}" stroke="${lagnamTextColors.stroke}">${currentLang === "ta" ? "லக்னம்" : "Lagnam"} (${formatLagnamDegree(lagnamAngle)})</text>`;
          svg += `</g>`;
          document.getElementById("chart").innerHTML = svg;
        };

        const renderChartFromFormInputs = () => {
          if (!chartInitialized || isEditingPositions) return;
          const chartDate = chartDateTimeFromLocalInputs(
            dateInput.value,
            timeInput.value,
            placeState,
          );
          renderChart(chartDate, placeState, true);
        };

        function renderChart(date, place = placeState, resetPositions = false) {
          currentChartDate = date;
          const finishRender = () => {
            const zeroLeft = currentLang === "ta" ? "0° இடது புறம்" : "0° on left";
            document.getElementById("subtitleMeta").textContent = ` · ${zeroLeft} · ${formatDateTimeLabel(date, place)}`;
            document.getElementById("tableDate").textContent = formatDateTimeLabel(date, place);
            renderTable();
            renderChartSvg(date, place, chartPositions);
          };

          if (resetPositions || !chartPositions.length) {
            void loadChartPositions(date).then((positions) => {
              chartPositions = positions;
              isEditingPositions = false;
              editDraft = [];
              editPositionsBtn.hidden = false;
              donePositionsBtn.hidden = true;
              finishRender();
            });
            return;
          }

          finishRender();
        }

        editPositionsBtn.addEventListener("click", () => {
          isEditingPositions = true;
          editDraft = chartPositions.map((position) => ({ ...position }));
          editPositionsBtn.hidden = true;
          donePositionsBtn.hidden = false;
          renderTable();
        });

        refreshPositionsBtn.addEventListener("click", () => {
          void loadChartPositions(currentChartDate).then((positions) => {
            chartPositions = positions;
            isEditingPositions = false;
            editDraft = [];
            editPositionsBtn.hidden = false;
            donePositionsBtn.hidden = true;
            renderChartSvg(currentChartDate, placeState, chartPositions);
            renderTable();
          });
        });

        donePositionsBtn.addEventListener("click", () => {
          chartPositions = editDraft.map((position) => {
            const longitude = norm(position.longitude);
            return { ...position, longitude, ...zodiac(longitude) };
          });
          isEditingPositions = false;
          editDraft = [];
          editPositionsBtn.hidden = false;
          donePositionsBtn.hidden = true;
          renderChartSvg(currentChartDate, placeState, chartPositions);
          renderTable();
        });

        const langTabTa = document.getElementById("langTabTa");
        const langTabEn = document.getElementById("langTabEn");
        let chartInitialized = false;

        const setLanguage = (lang, rerender = true) => {
          currentLang = lang;
          localStorage.setItem("velliastro-lang", lang);
          document.documentElement.classList.remove("lang-ta", "lang-en");
          document.documentElement.classList.add(lang === "ta" ? "lang-ta" : "lang-en");
          document.documentElement.lang = lang === "ta" ? "ta" : "en";
          document.title = lang === "ta" ? "கிரக நிலைகள் · Planet Positions" : "Planet Positions";
          langTabTa.classList.toggle("is-active", lang === "ta");
          langTabEn.classList.toggle("is-active", lang === "en");
          langTabTa.setAttribute("aria-selected", lang === "ta" ? "true" : "false");
          langTabEn.setAttribute("aria-selected", lang === "en" ? "true" : "false");
          if (rerender && chartInitialized) {
            renderChart(currentChartDate, placeState, false);
          }
        };

        langTabTa.addEventListener("click", () => setLanguage("ta"));
        langTabEn.addEventListener("click", () => setLanguage("en"));
        setLanguage(currentLang, false);

        const today = new Date();
        const dateInput = document.getElementById("dateInput");
        const timeInput = document.getElementById("timeInput");
        const placeInput = document.getElementById("placeInput");
        const placeLocationBtn = document.getElementById("placeLocationBtn");
        const latInput = document.getElementById("latInput");
        const lonInput = document.getElementById("lonInput");
        dateInput.value = toInputValue(today);
        timeInput.value = toTimeInputValue(today);
        placeInput.value = placeState.placeName;
        updateCoordsDisplay(false);
        updateSunriseDisplay(dateInput.value);
        chartInitialized = true;
        void showNowAtCurrentLocation();

        dateInput.addEventListener("change", () => {
          updateSunriseDisplay(dateInput.value);
          renderChartFromFormInputs();
        });
        timeInput.addEventListener("change", renderChartFromFormInputs);
        latInput.addEventListener("blur", commitCoordsFromInputs);
        lonInput.addEventListener("blur", commitCoordsFromInputs);
        latInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            commitCoordsFromInputs();
          }
        });
        lonInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            commitCoordsFromInputs();
          }
        });

        let geocodeTimer = null;
        const scheduleGeocode = (query) => {
          if (geocodeTimer) clearTimeout(geocodeTimer);
          geocodeTimer = setTimeout(() => { void lookupCoordinates(query); }, 500);
        };

        placeInput.addEventListener("input", () => scheduleGeocode(placeInput.value));
        placeInput.addEventListener("blur", () => {
          if (geocodeTimer) clearTimeout(geocodeTimer);
          void lookupCoordinates(placeInput.value);
        });
        document.getElementById("placeSearchBtn").addEventListener("click", () => {
          if (geocodeTimer) clearTimeout(geocodeTimer);
          void lookupCoordinates(placeInput.value);
        });
        placeLocationBtn.addEventListener("click", () => {
          void showNowAtCurrentLocation();
        });

        document.getElementById("dateForm").addEventListener("submit", (e) => {
          e.preventDefault();
          if (geocodeTimer) clearTimeout(geocodeTimer);
          void applyPlaceFromForm().then(() => {
            renderChartFromFormInputs();
            updateSunriseDisplay(dateInput.value);
          });
        });
      } catch (error) {
        document.body.innerHTML = `<div style="padding:2rem;color:#ff6b6b;font-family:monospace"><h2>Chart failed to load</h2><pre>${error.message}</pre></div>`;
        console.error(error);
      }
    </script>
  </body>
</html>
